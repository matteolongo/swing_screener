services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: sh -c "alembic upgrade head && exec uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir api --reload-dir src"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=development
      - DATABASE_URL=sqlite:////app/data/swing_screener.db
      - AUTH_MODE=disabled
      - SESSION_COOKIE_SECURE=false
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - DEGIRO_USERNAME=${DEGIRO_USERNAME:-}
      - DEGIRO_PASSWORD=${DEGIRO_PASSWORD:-}
      - DEGIRO_INT_ACCOUNT=${DEGIRO_INT_ACCOUNT:-}
      - DEGIRO_TOTP_SECRET_KEY=${DEGIRO_TOTP_SECRET_KEY:-}
      - DEGIRO_ONE_TIME_PASSWORD=${DEGIRO_ONE_TIME_PASSWORD:-}
      - SEC_CONTACT_EMAIL=${SEC_CONTACT_EMAIL:-}

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./web-ui:/app/web-ui
      - web_node_modules:/app/web-ui/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_PERSISTENCE_MODE=api
      - VITE_ENABLE_LOCAL_PERSISTENCE=false
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api

volumes:
  web_node_modules:
